services:
  first-pod:
    image: node:22-alpine
    container_name: first-pod
    working_dir: /app
    command: sh -c "npm ci && npm run start:dev"
    environment:
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MOCK_API_BASE_URL: http://mock-api:4001
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    depends_on:
      redis:
        condition: service_healthy
      mock-api:
        condition: service_started
    restart: unless-stopped

  second-pod:
    image: node:22-alpine
    container_name: second-pod
    working_dir: /app
    command: sh -c "npm ci && npm run start:dev"
    environment:
      PORT: 3001
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MOCK_API_BASE_URL: http://mock-api:4001
    ports:
      - '3001:3001'
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    depends_on:
      redis:
        condition: service_healthy
      mock-api:
        condition: service_started
    restart: unless-stopped

  mock-api:
    image: node:22-alpine
    container_name: mock-api
    working_dir: /app
    command: sh -c "npm ci && npm run mock:api"
    ports:
      - '4001:4001'
    volumes:
      - .:/app
      - mock_api_node_modules:/app/node_modules
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  app_node_modules:
  mock_api_node_modules:
  redis_data:
